    <!-- Google Analytics 4 - Deferred until after LCP for better performance -->
    <script>
      // Defer GA loading until after LCP and user interaction
      var gaLoaded = false;
      function loadGA() {
        if (gaLoaded) return;
        gaLoaded = true;
        var gaScript = document.createElement('script');
        gaScript.src = 'https://www.googletagmanager.com/gtag/js?id=G-QZBNDFDW9Q';
        gaScript.async = true;
        document.head.appendChild(gaScript);
        
        gaScript.onload = function() {
          window.dataLayer = window.dataLayer || [];
          function gtag(){dataLayer.push(arguments);}
          window.gtag = gtag;
          gtag('js', new Date());
          gtag('config', 'G-QZBNDFDW9Q', {
            send_page_view: true,
            cookie_flags: 'SameSite=None;Secure'
          });
        };
      }
      // Load GA after 3s or on first interaction, whichever comes first
      setTimeout(loadGA, 3000);
      ['mousedown', 'keydown', 'touchstart', 'scroll'].forEach(function(e) {
        document.addEventListener(e, loadGA, { once: true, passive: true });
      });
    </script>
